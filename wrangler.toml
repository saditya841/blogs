name = "blogs"
main = "src/index.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["0 * * * *"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "virall-db"
database_id = "3e20e9da-4c1b-422c-bdd4-16dc63b9ceca"

[vars]
SITE_URL = "https://virall.in"
SITE_NAME = "Virall"
SITE_TAGLINE = "Trending khabrein, saaf aur sourced"
AUTHOR_NAME = "Virall Desk"
CONTACT_EMAIL = "saditya841@gmail.com"
# AdSense approve hone ke baad: pub-XXXXXXXXXXXXXXXX aur ad unit slot ID bharo
ADSENSE_PUB = ""
ADSENSE_SLOT = ""
# IndexNow (Bing/Yandex ko turant batata hai). Koi bhi 16-32 random letters/numbers likho
INDEXNOW_KEY = "k8x2m9q4v7b1n6c3z5b1"
# AI auto-publish (admin page ka switch ON ho tab): itne ghante draft par koi action na ho aur score itna ya zyada ho to live. Switch default OFF hai.
AUTO_APPROVE_HOURS = "1"
AUTO_APPROVE_MIN_SCORE = "95"
# Is se kam shabdon ke post par ads nahi dikhenge (thin content se bachav)
MIN_WORDS_FOR_ADS = "600"
# Roz kitne naye trending topics (20 = roz 20 topics)
DAILY_TOPIC_LIMIT = "10"
# Roz max kitne naye drafts
DAILY_POST_LIMIT = "5"
# Post ki bhasha: hi ya en
POST_LANG = "hi"
TRENDS_GEO = "IN"
# Workers AI model (khali chhodo to code khud chalne wala model chunega)
AI_MODEL = "@cf/openai/gpt-oss-20b"
