name = "blogs"
main = "src/index.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "virall-db"
database_id = "3e20e9da-4c1b-422c-bdd4-16dc63b9ceca"

# KV for API usage tracking.
# STEP: Cloudflare dashboard se KV namespace banao, uski 32-character ID neeche quotes ke andar paste karo.
[[kv_namespaces]]
binding = "API_USAGE"
id = "6dce422731e44a45b993d1a46a7a0ab9"

[vars]
SITE_URL = "https://virall.in"
SITE_NAME = "Virall"
SITE_TAGLINE = "Business samajh, numbers ke saath"
AUTHOR_NAME = "Virall Desk"
CONTACT_EMAIL = "saditya841@gmail.com"
ADSENSE_PUB = ""
ADSENSE_SLOT = ""
INDEXNOW_KEY = "k8x2m9q4v7b1n6c3z5b1"
AUTO_APPROVE_HOURS = "1"
AUTO_APPROVE_MIN_SCORE = "95"
MIN_WORDS_FOR_ADS = "600"
DAILY_TOPIC_LIMIT = "10"
DAILY_POST_LIMIT = "5"
POST_LANG = "eng"
TRENDS_GEO = "IN"

# Business content mode (additive: news pipeline stays available if this is false).
# 3 deep articles/day is the target: BUSINESS_DAILY_LIMIT is a hard cap, not a quota.
BUSINESS_MODE = "true"
BUSINESS_LANG = "en"
BUSINESS_DAILY_LIMIT = "3"
BUSINESS_MIN_WORDS = "1200"
BUSINESS_TOPIC_LIMIT = "3"

# "AI drafts, human approves" safety rails (only used when auto_write is ON in admin).
# Hourly cron already exists; these stop a 24-drafts/day content farm and keep the review queue small.
AUTO_DRAFT_QUEUE_MAX = "6"
AUTO_DRAFT_MIN_SCORE = "60"
# Workers AI still available as fallback
AI_MODEL = "@cf/openai/gpt-oss-20b"

# Multi-API system ON
USE_MULTI_API = "true"

# Multi-AI debate (safe Reporter / Analyst / Skeptic + judge). The claim ledger is checked by code.
DEBATE_ENABLED = "true"
DEBATE_ROUNDS = "1"
DEBATE_ROLES = "3"
DEBATE_TIMEOUT_MS = "45000"
DEBATE_REUSE_SECONDS = "7200"
MIN_AGREE_SOURCES = "2"

# Duplicate protection + style guard (0 token)
DUPLICATE_CHECK = "true"
DUP_MAX_SIMILARITY = "0.82"
DUP_CHECK_LIMIT = "400"
STYLE_MIN_SCORE = "60"

# Human approval + fact quality (0 token). REQUIRE_HUMAN_EDIT=true means a draft is never
# published (manual or auto) until a person edits it or writes a 30+ character check note.
REQUIRE_HUMAN_EDIT = "true"
FACT_REGISTRY = "true"
FACT_MAX_AGE_HOURS = "24"
VOICE_PROFILE = "true"
VOICE_PROFILE_LIMIT = "10"
SOURCE_RECHECK = "true"
SOURCE_RECHECK_MAX = "3"
SOURCE_RECHECK_TIMEOUT_MS = "3000"
ORIGINALITY_TARGET = "0.85"
SPECIFICITY_LOW = "3"
SPECIFICITY_HIGH = "10"

# API KEYS yahan NAHI hain. Ye Cloudflare Secrets me rakhi jaati hain:
# GROQ_API_KEY, GEMINI_API_KEY, HUGGINGFACE_API_KEY, COHERE_API_KEY
